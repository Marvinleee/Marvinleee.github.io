{% if page.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: { '[+]': ['ams', 'color', 'mhchem'] }
    },
    loader: {
      load: ['[tex]/ams', '[tex]/color', '[tex]/mhchem']
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'no-mathjax'
    }
  };
</script>
<script src="{{ site.baseurl }}/assets/mathjax/tex-mml-chtml.js" id="MathJax-script" async></script>
{% endif %}
