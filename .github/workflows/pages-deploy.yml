name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      # 护栏：防止主题 CSS 静默塌缩后仍被部署上线
      # 2026-09-13 / 2026-09-14 两次全站样式丢失，都是构建"成功"却产出 1.2 KB 的空壳 CSS。
      - name: Guard theme CSS
        run: |
          CSS="_site${{ steps.pages.outputs.base_path }}/assets/css/jekyll-theme-chirpy.css"
          if [ ! -f "$CSS" ]; then
            echo "::error::未生成主题 CSS：$CSS"
            exit 1
          fi
          SIZE=$(wc -c < "$CSS" | tr -d ' ')
          echo "主题 CSS = ${SIZE} 字节（正常约 109940）"
          if [ "$SIZE" -lt 50000 ]; then
            echo "::error::主题 CSS 仅 ${SIZE} 字节，样式已塌缩，拒绝部署。"
            echo "原因通常是 jekyll-sass-converter 被降到 2.2.0（LibSass）——"
            echo "LibSass 不支持 Chirpy 主题的 @use 语法，会静默产出空壳样式。"
            echo "请检查：① Gemfile 是否钉死 converter；② 仓库是否混入了 Gemfile.lock。"
            exit 1
          fi

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
