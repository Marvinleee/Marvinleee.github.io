<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const D = window.CITY;
const T = D.terrain, NX = T.nx, NY = T.ny, DX = T.dx, DY = T.dy;
const W = D.w, Hm = D.h;
const HGT = T.h;

function terrAt(x, z){
  const fi = x/DX - 0.5, fj = z/DY - 0.5;
  let i = Math.floor(fi), j = Math.floor(fj);
  if (i < 0) i = 0; else if (i > NX-2) i = NX-2;
  if (j < 0) j = 0; else if (j > NY-2) j = NY-2;
  let u = fi - i, v = fj - j;
  if (u < 0) u = 0; else if (u > 1) u = 1;
  if (v < 0) v = 0; else if (v > 1) v = 1;
  const a = HGT[j][i], b = HGT[j][i+1], c = HGT[j+1][i], d = HGT[j+1][i+1];
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
const clamp01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);

/* ---------- 渲染器 ---------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const DMAX = Math.max(W, Hm);
scene.fog = new THREE.Fog(0xc6d9e8, DMAX*0.45, DMAX*2.4);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 5, DMAX*8);
const CX = W*0.47, CZ = Hm*0.62;
camera.position.set(CX - W*0.24, DMAX*0.30, CZ + Hm*0.32);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.target.set(CX, 40, CZ);
controls.maxPolarAngle = Math.PI*0.487;
controls.minDistance = 260;
controls.maxDistance = DMAX*2.4;

/* ---------- 天空 ---------- */
function skyTexture(stops){
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  for (const s of stops) grd.addColorStop(s[0], s[1]);
  g.fillStyle = grd; g.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const SKY = {
  day:   skyTexture([[0,'#5b93c9'],[0.45,'#9cc3e4'],[0.78,'#cfe1ee'],[1,'#dfe9f0']]),
  sun:   skyTexture([[0,'#1f3357'],[0.34,'#5d5570'],[0.62,'#c1746a'],[0.85,'#e9a86e'],[1,'#f4c992']]),
  night: skyTexture([[0,'#05080f'],[0.5,'#0b1224'],[1,'#1b2a44']])
};
const skyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(DMAX*3.2, 32, 16),
  new THREE.MeshBasicMaterial({map:SKY.day, side:THREE.BackSide, fog:false, depthWrite:false})
);
scene.add(skyMesh);

/* ---------- 光照 ---------- */
const hemi = new THREE.HemisphereLight(0xbcd8ef, 0x4e4a3e, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.45);
sun.position.set(-DMAX*0.6, DMAX*0.9, DMAX*0.5);
scene.add(sun);
const amb = new THREE.AmbientLight(0x8fa8c0, 0.26);
scene.add(amb);

/* ---------- 地表覆盖栅格化 ---------- */
const COV = { NONE:0, WATER:1, HEATH:2, GRASS:3, SCRUB:4, FOREST:5,
              ROCK:6, SAND:7, LAVA:8, WET:9, INDUSTRIAL:10 };
const cover = new Uint8Array(NX*NY);

// 扫描线填充：对每条横跨的横向扫描线取交点对，按"单元格接触"方式填满
// （floor 左界 ~ ceil 右界）。这样宽度不足一格的细长地物——海滩、窄绿化带、
// 河流谷地、熔岩裂隙——也能留下连续色带，不再被整行漏掉。
function fillPoly(xs, zs, val){
  const n = xs.length; if (n < 3) return;
  let zmin=Infinity, zmax=-Infinity, xmin=Infinity, xmax=-Infinity;
  for (let k=0;k<n;k++){
    const x = xs[k]*0.1, z = zs[k]*0.1;
    if (z<zmin) zmin=z; if (z>zmax) zmax=z;
    if (x<xmin) xmin=x; if (x>xmax) xmax=x;
  }
  const j0 = Math.max(0, Math.floor(zmin/DY)), j1 = Math.min(NY-1, Math.ceil(zmax/DY));
  if (j1 < j0) return;
  const i0 = Math.max(0, Math.floor(xmin/DX)), i1 = Math.min(NX-1, Math.ceil(xmax/DX));
  if (i1 < i0) return;
  for (let j=j0;j<=j1;j++){
    const z = j*DY; const XI = [];
    for (let k=0;k<n;k++){
      const k2 = (k+1)%n;
      const x1=xs[k]*0.1, z1=zs[k]*0.1, x2=xs[k2]*0.1, z2=zs[k2]*0.1;
      if ((z1<=z && z2>z) || (z2<=z && z1>z)) XI.push(x1 + (z-z1)/(z2-z1)*(x2-x1));
    }
    if (XI.length < 2) continue;
    XI.sort((a,b)=>a-b);
    for (let t=0; t+1<XI.length; t+=2){
      const ia = Math.max(0, Math.floor(XI[t]/DX));
      const ib = Math.min(NX-1, Math.ceil(XI[t+1]/DX));
      if (ia > ib) continue;
      for (let i=ia;i<=ib;i++) cover[j*NX+i] = val;
    }
  }
}
function drawRiver(xs, zs, val, half){
  for (let k=0;k+1<xs.length;k++){
    const x1=xs[k]*0.1, z1=zs[k]*0.1, x2=xs[k+1]*0.1, z2=zs[k+1]*0.1;
    const steps = Math.max(1, Math.min(3000, Math.ceil(Math.hypot(x2-x1, z2-z1)/(DX*0.5))));
    for (let s=0;s<=steps;s++){
      const t = s/steps, x = x1+(x2-x1)*t, z = z1+(z2-z1)*t;
      const i0 = Math.max(0, Math.floor((x-half)/DX)), i1 = Math.min(NX-1, Math.ceil((x+half)/DX));
      const j0 = Math.max(0, Math.floor((z-half)/DY)), j1 = Math.min(NY-1, Math.ceil((z+half)/DY));
      const h2 = half*half;
      for (let j=j0;j<=j1;j++){
        const dz = j*DY - z, row = j*NX;
        for (let i=i0;i<=i1;i++){
          const dx = i*DX - x;
          if (dx*dx + dz*dz <= h2) cover[row+i] = val;
        }
      }
    }
  }
}
const LAND_OF = {heath:COV.HEATH, grassland:COV.GRASS, grass:COV.GRASS, scrub:COV.SCRUB,
                 wood:COV.FOREST, forest:COV.FOREST,
                 bare_rock:COV.ROCK, sand:COV.SAND,
                 lava:COV.LAVA, wetland:COV.WET, industrial:COV.INDUSTRIAL};
let nLava = 0, nVeg = 0, nInd = 0;
for (const L of (D.land || [])){
  const v = LAND_OF[L[0]]; if (v === undefined) continue;
  fillPoly(L[1], L[2], v);
  if (v === COV.LAVA || v === COV.ROCK) nLava++;
  else if (v === COV.INDUSTRIAL) nInd++;
  else nVeg++;
}
for (const w of (D.water || [])) fillPoly(w[0], w[1], COV.WATER);
for (const r of (D.river || [])) drawRiver(r[0], r[1], COV.WATER, 14);

/* ---------- 地形 ---------- */
let texag = 1.8, bhexag = 3;
const C = {
  seabed:[0.115,0.200,0.255], sand:[0.305,0.285,0.245],
  lava:[0.180,0.168,0.162],     // 火山熔岩：近黑的玄武岩
  heath:[0.290,0.360,0.215], grass:[0.325,0.400,0.240], scrub:[0.265,0.325,0.205],
  forest:[0.205,0.285,0.175], rock:[0.400,0.385,0.355], high:[0.470,0.460,0.440],
  snow:[0.790,0.820,0.850], coastal:[0.285,0.345,0.215],
  wet:[0.240,0.310,0.225], industrial:[0.360,0.355,0.345]
};
// 确定性伪噪声，用于打散未标注地表的色块
function hash2(i, j){
  const h = Math.sin(i*127.1 + j*311.7) * 43758.5453;
  return h - Math.floor(h);
}
// 未标注地表的真实冰岛地貌：低处以火山熔岩原 + 苔原荒野为主，随高程过渡到裸岩、
// 峰顶残雪；用伪噪声混合与明暗扰动打散大色块，避免 90% 陆地看起来单调。
function bareColor(i, j){
  const h = HGT[j][i];
  if (h < -1) return C.seabed;
  const i0 = i>0?i-1:i, i1 = i<NX-1?i+1:i, j0 = j>0?j-1:j, j1 = j<NY-1?j+1:j;
  const slope = Math.max(Math.abs(HGT[j][i1]-HGT[j][i0]), Math.abs(HGT[j1][i]-HGT[j0][i])) / (2*DX);
  const nz  = hash2(i, j);
  const nz2 = hash2(i*1.7 + 5, j*1.3 + 9);
  if (h < 4){
    // 潮间带 / 海岸：偏暗的火山砂与苔岸过渡
    const u = 0.35 + 0.4*nz;
    return [ C.sand[0] + (C.coastal[0]-C.sand[0])*u,
             C.sand[1] + (C.coastal[1]-C.sand[1])*u,
             C.sand[2] + (C.coastal[2]-C.sand[2])*u ];
  }
  const t = clamp01((h - 30) / 330);
  // 熔岩原(深) ↔ 苔原荒野(浅) 的过渡，低海拔更多熔岩原
  const lv = clamp01(0.62 + 0.55*(nz-0.5) - 0.35*t);
  let r = C.lava[0] + (C.heath[0]-C.lava[0])*lv;
  let g = C.lava[1] + (C.heath[1]-C.lava[1])*lv;
  let b = C.lava[2] + (C.heath[2]-C.lava[2])*lv;
  // 随高程向裸岩过渡
  const tr = clamp01((h-180)/260);
  r += (C.rock[0]-r)*tr*0.6; g += (C.rock[1]-g)*tr*0.6; b += (C.rock[2]-b)*tr*0.6;
  if (h > 380){ const u = clamp01((h-380)/220); r += (C.high[0]-r)*u; g += (C.high[1]-g)*u; b += (C.high[2]-b)*u; }
  if (h > 560){ const u = clamp01((h-560)/90);  r += (C.snow[0]-r)*u; g += (C.snow[1]-g)*u; b += (C.snow[2]-b)*u; }
  if (slope > 0.28){ const u = clamp01((slope-0.28)/0.35)*0.85; r += (C.rock[0]-r)*u; g += (C.rock[1]-g)*u; b += (C.rock[2]-b)*u; }
  // 细粒度明暗扰动增强地形质感
  const sh = (nz2-0.5)*0.05;
  return [clamp01(r+sh), clamp01(g+sh), clamp01(b+sh)];
}
function terrainColor(i, j){
  const h = HGT[j][i];
  if (h < -1) return C.seabed;
  switch (cover[j*NX+i]) {
    case COV.WATER:      return C.seabed;
    case COV.LAVA:       return C.lava;
    case COV.ROCK:       return C.rock;
    case COV.FOREST:     return C.forest;
    case COV.HEATH:      return C.heath;
    case COV.SCRUB:      return C.scrub;
    case COV.GRASS:      return C.grass;
    case COV.SAND:       return C.sand;
    case COV.WET:        return C.wet;
    case COV.INDUSTRIAL: return C.industrial;
  }
  return bareColor(i, j);
}

const tPos = new Float32Array(NX*NY*3);
const tCol = new Float32Array(NX*NY*3);
const tBase = new Float32Array(NX*NY);
{
  let p = 0;
  for (let j=0;j<NY;j++){
    for (let i=0;i<NX;i++){
      const h = HGT[j][i];
      tBase[j*NX+i] = h;
      tPos[p] = i*DX; tPos[p+1] = h; tPos[p+2] = j*DY; p += 3;
      const c = terrainColor(i, j);
      const k = j*NX+i;
      tCol[k*3] = c[0]; tCol[k*3+1] = c[1]; tCol[k*3+2] = c[2];
    }
  }
}
const tIdx = new (NX*NY > 65535 ? Uint32Array : Uint16Array)((NX-1)*(NY-1)*6);
{
  let e = 0;
  for (let j=0;j<NY-1;j++){
    for (let i=0;i<NX-1;i++){
      const a = j*NX+i, b = a+1, c = a+NX, d = c+1;
      tIdx[e++]=a; tIdx[e++]=c; tIdx[e++]=b;
      tIdx[e++]=b; tIdx[e++]=c; tIdx[e++]=d;
    }
  }
}
const terrGeo = new THREE.BufferGeometry();
terrGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
terrGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));

/* 裙边：遮住 bbox 边界的断面 */
const EDGES = [];
for (let i=0;i<NX-1;i++){ EDGES.push([i,0,i+1,0], [i+1,NY-1,i,NY-1]); }
for (let j=0;j<NY-1;j++){ EDGES.push([0,j+1,0,j], [NX-1,j,NX-1,j+1]); }
const sPos = new Float32Array(EDGES.length*18);
const sBase = new Float32Array(EDGES.length*6);
{
  let sp = 0, sb = 0;
  const BOT = -450;
  for (const E of EDGES){
    const i0=E[0], j0=E[1], i1=E[2], j1=E[3];
    const ax = i0*DX, az = j0*DY, bx = i1*DX, bz = j1*DY;
    const ah = HGT[j0][i0], bh = HGT[j1][i1];
    const quad = [[ax,ah,az],[bx,bh,bz],[bx,BOT,bz],[ax,ah,az],[bx,BOT,bz],[ax,BOT,az]];
    for (const v of quad){
      sPos[sp++] = v[0]; sPos[sp++] = v[1]; sPos[sp++] = v[2];
      sBase[sb++] = v[1];
    }
  }
}
const skirtGeo = new THREE.BufferGeometry();

const seaMat = new THREE.MeshPhongMaterial({

const sea = new THREE.Mesh(new THREE.PlaneGeometry(W*4, Hm*4), seaMat);

const lakeMat = new THREE.MeshPhongMaterial({
  color:0x2a6a86, transparent:true, opacity:0.94, shininess:70, specular:0x8fc4dd
});
let nLakes = 0;
for (const w of (D.water || [])){
  const xs = w[0], zs = w[1], n = xs.length;
  if (n < 4) continue;
  let area = 0;
  for (let k=0;k<n;k++){ const k2=(k+1)%n; area += xs[k]*0.1*zs[k2]*0.1 - xs[k2]*0.1*zs[k]*0.1; }
  if (Math.abs(area)/2 < 3000) continue;
  let cx=0, cz=0, ysum=0;
  for (let k=0;k<n;k++){ cx += xs[k]*0.1; cz += zs[k]*0.1; ysum += terrAt(xs[k]*0.1, zs[k]*0.1); }
  cx/=n; cz/=n; ysum/=n;
  const pos = [];
  for (let k=1;k<n-1;k++){
    const A=[xs[0]*0.1, zs[0]*0.1], Bp=[xs[k]*0.1, zs[k]*0.1], Cp=[xs[k+1]*0.1, zs[k+1]*0.1];
    const cr = (Bp[0]-A[0])*(Cp[1]-A[1]) - (Bp[1]-A[1])*(Cp[0]-A[0]);
    if (Math.abs(cr) < 1e-3) continue;
    const tri = cr < 0 ? [A,Bp,Cp] : [A,Cp,Bp];
    for (const v of tri) pos.push(v[0]-cx, 0, v[1]-cz);
  }
  if (!pos.length) continue;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.Mesh(g, lakeMat);
  m.position.set(cx, ysum - 0.6, cz);
  m.userData.y0 = ysum;
  waterGroup.add(m); nLakes++;
}

    const cr = (Bp[0]-A[0])*(Cp[1]-A[1]) - (Bp[1]-A[1])*(Cp[0]-A[0]);
    if (Math.abs(cr) < 1e-4) continue;
    const tri = cr < 0 ? [A,Bp,Cp] : [A,Cp,Bp];

/* ---------- 建筑 ---------- */
const B = D.b, NB = B.n, BG = B.g, BH = B.h, BS = B.s, BY = B.y;
const WALL = [
  [0.855,0.840,0.800],[0.925,0.910,0.875],[0.660,0.390,0.330],
  [0.800,0.660,0.400],[0.430,0.520,0.600],[0.420,0.415,0.395],
  [0.870,0.815,0.700],[0.560,0.580,0.560],[0.760,0.780,0.760]
];
const ROOF = [
  [0.290,0.290,0.300],[0.360,0.280,0.250],[0.240,0.340,0.400],
  [0.380,0.330,0.230],[0.220,0.230,0.240],[0.330,0.360,0.330]
];
const SRC_COL = [[0.239,0.863,0.518],[1.0,0.769,0.420],[0.498,0.576,0.690]];

let colorMode = 'real';
let bGeo, bMesh, bPos, bBase, bFlag, bHgt, colDay, colNight, bVerts = 0;

function buildCity(){
  let total = 0;
  for (let i=0;i<NB;i++){
    const n = (BG[i].length-2)/2;
    if (n < 3) continue;
    total += n*6 + (n-2)*3;
  }
  const pos = new Float32Array(total*3);
  const base = new Float32Array(total);
  const flag = new Uint8Array(total);
  const hgt = new Float32Array(total);
  const cD = new Float32Array(total*3);
  const cN = new Float32Array(total*3);
  let o = 0, oo = 0;
  for (let i=0;i<NB;i++){
    const g = BG[i], n = (g.length-2)/2;
    if (n < 3) continue;
    const bx = g[0]*0.1, bz = g[1]*0.1;
    const xs = new Float64Array(n), zs = new Float64Array(n);
    for (let k=0;k<n;k++){ xs[k] = g[2+2*k]*0.1; zs[k] = g[3+2*k]*0.1; }
    let ar = 0;
    for (let k=0;k<n;k++){ const k2=(k+1)%n; ar += xs[k]*zs[k2] - xs[k2]*zs[k]; }
    if (ar > 0){ xs.reverse(); zs.reverse(); }
    const h = BH[i]*0.1, baseY = BY[i]*0.1, src = BS[i];
    const hash = (i*2654435761) >>> 0;
    let wr, wg, wb, rr, rg, rb;
    if (colorMode === 'src'){
      const c = SRC_COL[src];
      wr=c[0]; wg=c[1]; wb=c[2]; rr=c[0]*0.72; rg=c[1]*0.72; rb=c[2]*0.72;
    } else {
      const wp = WALL[hash % WALL.length];
      const rp = ROOF[(hash >>> 8) % ROOF.length];
      wr=wp[0]; wg=wp[1]; wb=wp[2]; rr=rp[0]; rg=rp[1]; rb=rp[2];
    }
    const lit = ((hash >>> 16) % 100) < 38;
    const nr = lit ? 0.92 : 0.09, ng = lit ? 0.73 : 0.11, nb = lit ? 0.40 : 0.17;
    for (let k=0;k<n;k++){
      const k2 = (k+1)%n;
      const ax = xs[k], az = zs[k], bx2 = xs[k2], bz2 = zs[k2];
      if (Math.abs(bx2-ax) < 1e-3 && Math.abs(bz2-az) < 1e-3) continue;
      const tris = [
        [ax,0,az, bx2,0,bz2, bx2,1,bz2],
        [ax,0,az, bx2,1,bz2, ax,1,az]
      ];
      for (const t of tris){
        for (let s=0;s<3;s++){
          pos[oo] = bx + t[s*3]; pos[oo+1] = 0; pos[oo+2] = bz + t[s*3+2];
          base[o] = baseY; flag[o] = t[s*3+1]; hgt[o] = h;
          cD[oo]=wr; cD[oo+1]=wg; cD[oo+2]=wb;
          cN[oo]=nr; cN[oo+1]=ng; cN[oo+2]=nb;
          oo += 3; o++;
        }
      }
    }
    for (let k=1;k<n-1;k++){
      const x0=xs[0],z0=zs[0],x1=xs[k],z1=zs[k],x2=xs[k+1],z2=zs[k+1];
      const cr = (x1-x0)*(z2-z0) - (z1-z0)*(x2-x0);
      if (Math.abs(cr) < 1e-3) continue;
      const tri = cr < 0 ? [[x0,z0],[x1,z1],[x2,z2]] : [[x0,z0],[x2,z2],[x1,z1]];
      for (const v of tri){
        pos[oo] = bx + v[0]; pos[oo+1] = 0; pos[oo+2] = bz + v[1];
        base[o] = baseY; flag[o] = 1; hgt[o] = h;
        cD[oo]=rr; cD[oo+1]=rg; cD[oo+2]=rb;
        cN[oo]=rr*0.34; cN[oo+1]=rg*0.34; cN[oo+2]=rb*0.38;
        oo += 3; o++;
      }
    }
  }
  bPos = pos.subarray(0, oo);
  bBase = base.subarray(0, o); bFlag = flag.subarray(0, o); bHgt = hgt.subarray(0, o);
  colDay = cD.subarray(0, oo); colNight = cN.subarray(0, oo);
  bVerts = o;
  bGeo = new THREE.BufferGeometry();
  bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
  bGeo.setAttribute('color', new THREE.BufferAttribute(colDay, 3));
  bMesh = new THREE.Mesh(bGeo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
  scene.add(bMesh);
}

/* ---------- 道路 ---------- */
let roadLines = null;
const ROAD_COL = {motorway:[0.72,0.62,0.44], trunk:[0.72,0.62,0.44],
                  primary:[0.82,0.78,0.68], secondary:[0.74,0.72,0.64], tertiary:[0.66,0.65,0.60]};
function buildRoads(){
  const pos = [], col = [], base = [];
  for (const r of (D.road || [])){
    const xs = r[1], zs = r[2];
    const c = ROAD_COL[r[0]] || [0.66,0.65,0.60];
    for (let k=0;k+1<xs.length;k++){
      const x1=xs[k]*0.1, z1=zs[k]*0.1, x2=xs[k+1]*0.1, z2=zs[k+1]*0.1;
      if (Math.abs(x1-x2) > 1200 || Math.abs(z1-z2) > 1200) continue;
      pos.push(x1,0,z1, x2,0,z2);
      base.push(terrAt(x1,z1), terrAt(x2,z2));
      col.push(c[0],c[1],c[2], c[0],c[1],c[2]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  roadLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.92}));
  roadLines.userData.base = new Float32Array(base);
  scene.add(roadLines);
}

/* ---------- 夸张系数 ---------- */
function applyExag(){
  for (let k=0;k<tBase.length;k++) tPos[k*3+1] = tBase[k]*texag;
  terrGeo.attributes.position.needsUpdate = true;
  terrGeo.computeVertexNormals();
  for (let k=0;k<sBase.length;k++) sPos[k*3+1] = sBase[k] < -400 ? sBase[k] : sBase[k]*texag;
  skirtGeo.attributes.position.needsUpdate = true;
  if (bGeo){
    for (let k=0;k<bBase.length;k++) bPos[k*3+1] = bBase[k]*texag + bFlag[k]*bHgt[k]*bhexag;
    bGeo.attributes.position.needsUpdate = true;
    bGeo.computeVertexNormals();
  }
  if (roadLines){
    const P = roadLines.geometry.attributes.position.array;
    const Bd = roadLines.userData.base;
    for (let k=0;k<Bd.length;k++) P[k*3+1] = Bd[k]*texag + 1.8;
    roadLines.geometry.attributes.position.needsUpdate = true;
  }
  for (const m of waterGroup.children){
    if (m === sea || m.userData.y0 === undefined) continue;
    m.position.y = m.userData.y0*texag - 0.6;
  }
}

function renderStats(){

  for (let i=0;i<NB;i++) hs[i] = BH[i]*0.1;

    ['范围', (W*Hm/1e6).toFixed(1) + ' km²  （海域 ' + (T.sea_pct || 0) + '%）'],
    ['陆地高程', T.min + ' ~ ' + T.max + ' m'],

    ['实测高度', src[0] + ' 栋 (' + (src[0]/NB*100).toFixed(1) + '%)'],
    ['levels 推算', src[1].toLocaleString() + ' 栋 (' + (src[1]/NB*100).toFixed(1) + '%)'],
    ['类型估算', src[2].toLocaleString() + ' 栋 (' + (src[2]/NB*100).toFixed(1) + '%)'],
    ['湖泊 / 河流', nLakes + ' 片 / ' + (D.river||[]).length + ' 条'],
    ['熔岩 / 植被', nLava + ' / ' + nVeg + ' 片'],

}

  skyMesh.position.copy(camera.position);
  renderer.render(scene, camera);
  const now = performance.now(); acc += now - last; last = now; frames++;
  if (acc > 1000){
    const f = document.getElementById('fps');
    const cur = f.textContent.split(' · ').slice(0,2).join(' · ');
    f.textContent = cur + ' · ' + (frames*1000/acc).toFixed(0) + ' fps';
    acc = 0; frames = 0;
  }
}
loop();
</script>
</body>
</html>
