<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformer 层 · 数值实验室</title><link rel="stylesheet" href="../inference-atlas/style.css"><style>.lab-grid{display:grid;grid-template-columns:220px 1fr;gap:20px}.steps{display:flex;flex-direction:column;gap:6px}.steps button{text-align:left}.matrix{overflow:auto}.matrix table{border-collapse:separate;border-spacing:5px;width:100%;font: .95rem ui-monospace,monospace}.matrix td{padding:12px;text-align:center;background:#183647;border:1px solid #355568;min-width:60px}.matrix td.masked{color:#839aaa;background:#0a1420}.matrix caption{text-align:left;margin-bottom:10px}.settings{display:flex;gap:20px;flex-wrap:wrap;padding:16px;background:#142b3c;margin:20px 0}.settings label{display:block}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}#status{color:#ffcc80}pre{max-height:450px;overflow:auto}@media(max-width:700px){.lab-grid{grid-template-columns:1fr}.steps{display:grid;grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}}</style></head><body><header><a href="/posts/inference-03-transformer-layer/" target="_top">← 第 3 章正文</a><span>NUMERICAL LAB / 03</span></header><main><h1>一个层，逐项算出来</h1><p>3 个位置、d=4、2 个 Q 头共享 1 个 KV 头、单头维度 2、MLP 维度 6。全部为固定人造权重，计算顺序对照 Qwen3；数值不是实际模型输出。</p><div class="settings"><label>最后位置 x₂[0] <input id="last" type="range" min="-3" max="3" step=".1" value="1"><output id="lastVal">1</output></label><label>所有位置平移 <input id="offset" type="range" min="0" max="10" value="0"><output id="offsetVal">0</output></label><label>Query 头 <select id="head"><option value="0">Q 头 0 → KV 头 0</option><option value="1">Q 头 1 → KV 头 0</option></select></label><label><input id="causal" type="checkbox" checked>因果掩码</label><label><input id="rotary" type="checkbox" checked>RoPE</label><label><input id="qknorm" type="checkbox" checked>Q/K RMSNorm</label><button id="reset">重置</button></div><p id="status" role="status"></p><div
