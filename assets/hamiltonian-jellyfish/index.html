<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ============================================================
   0. 设备自适应
   ============================================================ */
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const N        = isMobile ? 72  : 130;   // 能量面网格分辨率
const COUNT    = isMobile ? 18  : 32;    // 粒子（相点）数量
const MAXTRAIL = isMobile ? 180 : 430;   // 拖尾长度
const CURVES   = isMobile ? 6   : 12;    // 相轨迹流线条数
const STEPS    = isMobile ? 220 : 420;   // 每条流线的积分步数

/* ============================================================
   1. 场景 / 相机 / 渲染器
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(5.9, 5.0, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3.5;
controls.maxDistance = 24;
controls.target.set(0, 0.7, 0);

/* 相平面躺在世界 XZ 平面上：group 绕 X 轴 −90°，
   几何体的 z（能量高度）变成世界 Y（竖直方向）。 */
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

const params = { a: 1, b: 2, m: 1, breathing: 0.25, speed: 1 };
const DEFAULTS = Object.assign({}, params);

/* 相坐标 ↔ 世界坐标的缩放：相平面 q,p ∈ [−2.2, 2.2] 铺满 6.4 的平面 */
const PS = 1.45;

/* ============================================================
   2. 哈密顿量与辛积分器
   ------------------------------------------------------------
   H(q,p) = p² / (2m) + a·q⁴ − b·q²
   q̇ = ∂H/∂p = p / m
   ṗ = −∂H/∂q = 2bq − 4aq³
   ============================================================ */
function potential(q) {
  return params.a * q * q * q * q - params.b * q * q;
}
function kinetic(p) {
  return (p * p) / (2 * params.m);
}
function energy(q, p) {
  return kinetic(p) + potential(q);
}
function force(q) {           // ṗ = F(q)
  return 2 * params.b * q - 4 * params.a * q * q * q;
}

/* 速度 Verlet / leapfrog：二阶、辛、时间可逆，长期能量不漂移 */
function leapfrog(state, h) {
  const p05 = state.p + 0.5 * h * force(state.q);
  state.q = state.q + h * p05 / params.m;
  state.p = p05 + 0.5 * h * force(state.q);
  return state;
}

/* ============================================================
   3. 能量面 → 水母伞体
   ============================================================ */
function surfaceHeight(x, y, t) {
  const q = x / PS, p = y / PS;
  const H = energy(q, p);
  const base = Math.tanh((H + 1.2) * 0.34) * 2.2;      // softclip，防止边缘数值爆炸
  const rr = Math.sqrt(x * x + y * y);
  const wave = params.breathing
    * Math.exp(-rr * rr / 7)
    * Math.sin(3.1 * rr - 1.7 * t);                    // “呼吸”只是视觉层
  return base * 0.85 + wave;
}

const geometry = new THREE.PlaneGeometry(6.4, 6.4, N, N);
const membrane = new THREE.Mesh(geometry, new THREE.MeshPhysicalMaterial({
  color: 0x6f8ea6, roughness: 0.5, metalness: 0.05,
  transparent: true, opacity: 0.36, side: THREE.DoubleSide, depthWrite: false
}));
world.add(membrane);

const wire = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
  color: 0x9ec7d9, wireframe: true, transparent: true, opacity: 0.055
}));
world.add(wire);

function updateSurface(t) {
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, surfaceHeight(pos.getX(i), pos.getY(i), t));
  }
  pos.needsUpdate = true;
  geometry.computeVertexNormals();
}

/* ============================================================
   4. 相轨迹流线：从若干初值出发，用同一个辛积分器积分出来的真实轨道
   ============================================================ */
const STREAM_H = 0.012;   // 流线积分步长
const streamData = [];     // 每条：[{q,p}, …]
const streamLines = [];

function rebuildStreams() {
  streamData.length = 0;
  for (let k = 0; k < CURVES; k++) {
    /* 初值均匀铺在不同半径的相空间圆上，跨越势垒内外 */
    const radius = 0.55 + 1.45 * (k + 0.5) / CURVES;
    const ang = (k / CURVES) * Math.PI * 2;
    const st = { q: radius * Math.cos(ang), p: radius * Math.sin(ang) };
    const pts = [];
    for (let s = 0; s < STEPS; s++) {
      leapfrog(st, STREAM_H);
      if (!isFinite(st.q) || !isFinite(st.p)) break;
      if (Math.abs(st.q) > 6 || Math.abs(st.p) > 6) break;   // 已经跑出可视范围
      pts.push({ q: st.q, p: st.p });
    }
    streamData.push(pts);
  }
}

function buildStreamLines() {
  for (const line of streamLines) {
    world.remove(line);
    line.geometry.dispose();
    line.material.dispose();
  }
  streamLines.length = 0;
  for (let k = 0; k < CURVES; k++) {
    const pts = streamData[k];
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts.length * 3), 3));
    const m = new THREE.LineBasicMaterial({
      color: k % 2 === 0 ? 0x4fb6e8 : 0x63c8d6,
      transparent: true, opacity: 0.30,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const line = new THREE.Line(g, m);
    world.add(line);
    streamLines.push(line);
  }
}

function updateStreams(t) {
  for (let k = 0; k < streamLines.length; k++) {
    const pts = streamData[k];
    const attr = streamLines[k].geometry.attributes.position;
    const arr = attr.array;
    for (let i = 0; i < pts.length; i++) {
      const x = pts[i].q * PS, y = pts[i].p * PS;
      arr[i * 3]     = x;
      arr[i * 3 + 1] = y;
      arr[i * 3 + 2] = surfaceHeight(x, y, t) + 0.03;
    }
    attr.needsUpdate = true;
    streamLines[k].geometry.setDrawRange(0, pts.length);
  }
}

/* ============================================================
   5. 粒子：相点 + 历史拖尾
   ============================================================ */
const TRAIL_COLORS = [0x7bdcff, 0x8ad6ff, 0xffa36b, 0xff7a5a, 0xcfe9ff, 0x6fb6ff];
const particles = [];
const headGeo = new THREE.SphereGeometry(0.045, 12, 12);

/* 在第 i 条能量等值面上取初值：E 从势阱底部分布到势垒之上 */
function initialCondition(i, total) {
  const E = -0.92 + 1.95 * (i + 0.5) / total;
  let q = 0, p = 0;
  for (let attempt = 0; attempt < 200; attempt++) {
    q = -1.9 + 3.8 * Math.random();
    const rem = E - potential(q);
    if (rem >= 0) {
      p = Math.sqrt(2 * params.m * rem) * (Math.random() < 0.5 ? 1 : -1);
      break;
    }
  }
  return { q, p };
}

function seedParticle(i, total) {
  const ic = initialCondition(i, total);
  const q = ic.q, p = ic.p;
  const color = TRAIL_COLORS[i % TRAIL_COLORS.length];
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAXTRAIL * 3), 3));
  const m = new THREE.LineBasicMaterial({
    color, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const trail = new THREE.Line(g, m);
  world.add(trail);

  const head = new THREE.Mesh(headGeo, new THREE.MeshBasicMaterial({ color }));
  world.add(head);

  return { q, p, E0: energy(q, p), trail, head, pts: [] };
}

function reseedParticles() {
  for (const pt of particles) {
    world.remove(pt.trail); world.remove(pt.head);
    pt.trail.geometry.dispose(); pt.trail.material.dispose();
    pt.head.material.dispose();
  }
  particles.length = 0;
  for (let i = 0; i < COUNT; i++) particles.push(seedParticle(i, COUNT));
}

/* 极端参数下粒子可能跑飞：就地重播种，不重建 GPU 资源 */
function respawn(pt, i) {
  const ic = initialCondition(i, COUNT);
  pt.q = ic.q;
  pt.p = ic.p;
  pt.E0 = energy(pt.q, pt.p);
  pt.pts.length = 0;
}

function updateParticles(t) {
  let maxDrift = 0;
  for (const pt of particles) {
    const x = pt.q * PS, y = pt.p * PS;
    const z = surfaceHeight(x, y, t) + 0.05;

    pt.pts.push(x, y, z);
    if (pt.pts.length > MAXTRAIL * 3) pt.pts.splice(0, pt.pts.length - MAXTRAIL * 3);

    const arr = pt.trail.geometry.attributes.position.array;
    arr.set(pt.pts);
    pt.trail.geometry.attributes.position.needsUpdate = true;
    pt.trail.geometry.setDrawRange(0, pt.pts.length / 3);

    pt.head.position.set(x, y, z);

    const drift = Math.abs((energy(pt.q, pt.p) - pt.E0) / (Math.abs(pt.E0) + 1e-6));
    if (drift > maxDrift) maxDrift = drift;
  }
  return maxDrift;
}

/* ============================================================
   6. 灯光
   ============================================================ */
scene.add(new THREE.AmbientLight(0x86b0d6, 0.62));
const cool = new THREE.PointLight(0x5abfff, 18, 22);
cool.position.set(-4.2, 3.4, 4.2);
scene.add(cool);
const warm = new THREE.PointLight(0xff7d43, 20, 22);
warm.position.set(3.8, 2.8, 4.6);
scene.add(warm);
const under = new THREE.PointLight(0x2f6f9e, 12, 18);
under.position.set(0, -3, 1.5);
scene.add(under);

/* ============================================================
   7. UI
   ============================================================ */
const readout = document.getElementById("readout");
const badge = document.getElementById("badge");

function bind(id, key, outId) {
  const el = document.getElementById(id);
  const out = document.getElementById(outId);
  function sync() {
    params[key] = Number(el.value);
    out.textContent = Number(el.value).toFixed(2);
  }
  el.addEventListener("input", sync);
  sync();
}
bind("a", "a", "aval");
bind("b", "b", "bval");
bind("m", "m", "mval");
bind("breathing", "breathing", "breathval");
bind("speed", "speed", "speedval");

/* a / b / m 改变 → 势能与能量面形状改变 → 重新播种并重建流线 */
function onPhysicsChange() {
  rebuildStreams();
  buildStreamLines();
  reseedParticles();
}
for (const id of ["a", "b", "m"]) {
  document.getElementById(id).addEventListener("input", onPhysicsChange);
}

document.getElementById("btn-full").addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    if (el.requestFullscreen) el.requestFullscreen();
  } else if (document.exitFullscreen) {
    document.exitFullscreen();
  }
});
document.getElementById("btn-hide").addEventListener("click", () => {
  document.body.classList.toggle("ui-hidden");
});
document.getElementById("btn-reset").addEventListener("click", () => {
  for (const k of ["a", "b", "m", "breathing", "speed"]) {
    const el = document.getElementById(k);
    el.value = DEFAULTS[k];
    el.dispatchEvent(new Event("input"));
  }
  onPhysicsChange();
  controls.target.set(0, 0.7, 0);
  camera.position.set(5.9, 5.0, 8.4);
});

addEventListener("keydown", e => {
  if (e.key && e.key.toLowerCase() === "h") {
    document.body.classList.toggle("ui-hidden");
  }
});

/* ============================================================
   8. 主循环
   ============================================================ */
const H_STEP = 0.004;      // 单个积分步的物理时间
const clock = new THREE.Clock();
let t = 0;
let acc = 0;
let driftShown = 0;
let frame = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.033);
  t += dt * params.speed;
  acc += dt * params.speed;

  /* 固定步长推进，保证积分精度不随帧率变化 */
  let steps = Math.round(acc / H_STEP);
  if (steps < 1) steps = 1;
  if (steps > 14) steps = 14;
  acc -= steps * H_STEP;
  if (acc < 0) acc = 0;

  for (let i = 0; i < particles.length; i++) {
    const pt = particles[i];
    for (let s = 0; s < steps; s++) leapfrog(pt, H_STEP);
    if (!isFinite(pt.q) || !isFinite(pt.p) || Math.abs(pt.q) > 8 || Math.abs(pt.p) > 8) {
      respawn(pt, i);
    }
  }

  updateSurface(t);
  updateStreams(t);
  const drift = updateParticles(t);

  /* 能量漂移读数：辛积分器的标志是长期有界振荡而非单调发散 */
  if (frame % 12 === 0) {
    driftShown = drift;
    const well = params.b * params.b / (4 * params.a);   // 势阱深度 |V|min = b²/4a
    readout.innerHTML = "ΔH/H₀ ≈ " + driftShown.toExponential(1)
      + "<br>势阱深度 b²/4a = " + well.toFixed(2);
    badge.textContent = params.a > 0 && params.b > 0
      ? "DOUBLE WELL · SYMPLECTIC"
      : "SINGLE WELL · SYMPLECTIC";
  }
  frame++;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

rebuildStreams();
buildStreamLines();
reseedParticles();

document.getElementById("loading").remove();
animate();
</script>
</body>
